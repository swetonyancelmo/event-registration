spring:
  application:
    name: event-registration

  profiles:
    default: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:event-registration-db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:1h}
  admin:
    name: ${ADMIN_NAME:Admin}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

springdoc:
  # documenta apenas as respostas declaradas em cada endpoint, em vez de anexar todos os @ExceptionHandler a todos eles
  override-with-generic-response: false
  default-produces-media-type: application/json
  swagger-ui:
    persist-authorization: true
    display-request-duration: true
    doc-expansion: none

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8080
