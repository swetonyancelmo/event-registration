version: "3.8"

services:
  database:
    image: postgres:16-alpine
    container_name: event-registration-database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: event-registration-db
    ports:
      - "5432:5432"
    volumes:
      - ./data/db:/var/lib/postgresql/data